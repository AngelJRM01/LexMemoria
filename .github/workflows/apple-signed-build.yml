name: Apple signed IPA
on:
  push:
    branches: [release/1.0.0-rc1]
    paths:
      - '.github/workflows/apple-signed-build.yml'
      - 'scripts/prepare_apple_signing.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-signed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  signed-ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Resolve locked dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Import temporary signing identity and validate provisioning
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$P12_BASE64" && test -n "$P12_PASSWORD" && test -n "$PROFILE_BASE64" || { echo 'Falta alguno de los tres secretos de firma iOS.'; exit 1; }
          python3 - <<'PY'
          import base64,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          for name,var in [('lexmemoria-signing.p12','P12_BASE64'),('lexmemoria-profile.mobileprovision','PROFILE_BASE64')]:
              (root/name).write_bytes(base64.b64decode(os.environ[var],validate=True))
          PY
          KEYCHAIN_PATH="$RUNNER_TEMP/lexmemoria-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/lexmemoria-signing.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/lexmemoria-profile.mobileprovision" > "$RUNNER_TEMP/lexmemoria-profile.plist"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" > "$RUNNER_TEMP/lexmemoria-identities.txt"
          python3 scripts/prepare_apple_signing.py --profile "$RUNNER_TEMP/lexmemoria-profile.plist" --identities "$RUNNER_TEMP/lexmemoria-identities.txt" --project mobile/ios/Runner.xcodeproj/project.pbxproj --export-options "$RUNNER_TEMP/lexmemoria-export.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/lexmemoria-profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$RUNNER_TEMP/lexmemoria-profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          cp "$RUNNER_TEMP/lexmemoria-profile.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
      - name: Build signed IPA without uploading to Apple
        working-directory: mobile
        run: flutter build ipa --release --export-options-plist="$RUNNER_TEMP/lexmemoria-export.plist" --dart-define=LEXMEMORIA_API_URL=https://lexmemoria-api.onrender.com
      - name: Verify signature and package IPA
        run: |
          set -euo pipefail
          APP=mobile/build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/lexmemoria-signed-entitlements.plist" 2>/dev/null
          python3 - <<'PY'
          import plistlib,os
          from pathlib import Path
          app=Path('mobile/build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app')
          info=plistlib.loads((app/'Info.plist').read_bytes())
          ent=plistlib.loads((Path(os.environ['RUNNER_TEMP'])/'lexmemoria-signed-entitlements.plist').read_bytes())
          assert info['CFBundleIdentifier']=='es.lexmemoria.app'
          assert info['CFBundleShortVersionString']=='1.0.0'
          assert info['CFBundleVersion']=='18'
          assert ent['application-identifier']=='ZR9YWRMKC8.es.lexmemoria.app'
          assert ent.get('get-task-allow',False) is False
          assert (app/'embedded.mobileprovision').is_file()
          PY
          mkdir -p apple-signed-artifacts
          cp mobile/build/ios/ipa/*.ipa apple-signed-artifacts/
          shasum -a 256 apple-signed-artifacts/*.ipa > apple-signed-artifacts/SHA256SUMS.txt
      - name: Upload signed IPA only
        id: upload_ipa
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LexMemoria-1.0.0-SIGNED-IPA-${{ github.run_number }}
          path: apple-signed-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retry transient artifact upload failure
        if: ${{ steps.upload_ipa.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: LexMemoria-1.0.0-SIGNED-IPA-${{ github.run_number }}
          path: apple-signed-artifacts/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14
      - name: Remove temporary signing material
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/lexmemoria-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/lexmemoria-signing.p12 "$RUNNER_TEMP"/lexmemoria-profile.* "$RUNNER_TEMP"/lexmemoria-identities.txt "$RUNNER_TEMP"/lexmemoria-export.plist "$RUNNER_TEMP"/lexmemoria-signed-entitlements.plist
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
