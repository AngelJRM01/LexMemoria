name: LexMemoria checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest -q
        working-directory: backend
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - run: flutter build web --release --no-web-resources-cdn
        working-directory: mobile
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - name: Allow the runner user to use KVM
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Verify native encrypted startup on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          script: cd mobile && flutter test integration_test/startup_test.dart -d emulator-5554 --no-pub
      - run: flutter build apk --release
        working-directory: mobile
        env:
          LEXMEMORIA_PREVIEW_SIGNING: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: lexmemoria-android-preview-sin-google
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - run: flutter build ios --simulator --debug
        working-directory: mobile
