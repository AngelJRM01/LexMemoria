name: lexmemoria
description: Estudio jurídico con fuentes, versiones y memoria espaciada.
publish_to: none
version: 0.4.1+7
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  sqflite_sqlcipher: ^3.3.0
  flutter_secure_storage: ^9.2.4
  http: ^1.4.0
  url_launcher: ^6.3.1
  flutter_tts: ^4.2.2
  file_picker: ^10.1.9
  share_plus: ^11.0.0
  csv: ^6.0.0
  uuid: ^4.5.1
  archive: ^4.6.0
  crypto: ^3.0.8
  path_provider: ^2.1.6
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/legal-catalogue.json
    - assets/legal/
    - assets/ready/
    - assets/corpus-catalogue.json.gz
